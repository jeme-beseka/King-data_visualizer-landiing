<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>King Data Visualizer</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Fallback Meta Tags (for when JS is disabled) -->
    <meta name="theme-color" content="#B8860B" />
    <meta name="application-name" content="King Data Visualizer" />
    <meta name="generator" content="React + Vite" />
    <link rel="canonical" href="https://king-datavisualizer.netlify.app/" />
    
    <!-- SEO META TAGS — managed by react-helmet-async in src/seo/SEOHead.jsx -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/orbitron/v21/yMJMMIlznpvZ1K4QG9vqKq4.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Critical CSS for above-the-fold content -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #0d0d1a;
        color: #f5f5ff;
        font-family: "Inter", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <!-- Preload critical assets -->
    <link rel="preload" href="/logo.png" as="image" />
    <link rel="preload" href="/welcome-screen.png" as="image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
