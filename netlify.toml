[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect all routes to index.html for React SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers for .exe file to force download instead of opening
[[headers]]
  for = "/King_Data_Visualizer-3.3.exe"
  [headers.values]
    Content-Disposition = "attachment; filename=King_Data_Visualizer-3.3.exe"
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=86400"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache-Control for HTML (no cache for SEO)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# Cache-Control for static assets (images, JS, CSS)
[[headers]]
  for = "/*.{js,css,png,jpg,jpeg,svg,webp,ico,woff,woff2,ttf,eot}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# DEPLOYMENT CHECKLIST:
# 1. Place King_Data_Visualizer-3.3.exe in /public folder before building
# 2. Run npm run build locally to verify build succeeds
# 3. Drag and drop dist/ folder to Netlify, or connect GitHub repo
# 4. Set environment variables in Netlify dashboard if needed
# 5. Test download functionality after deployment
# 6. If .exe grows beyond 100MB, consider Netlify Large Media add-on
